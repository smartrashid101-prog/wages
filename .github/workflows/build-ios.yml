name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug — list repo structure
        run: |
          echo "--- Repo root ---"
          ls -la
          echo "--- Looking for ios folder anywhere in repo ---"
          find . -maxdepth 3 -type d -iname "ios"
          echo "--- Looking for Podfile anywhere in repo ---"
          find . -maxdepth 4 -iname "Podfile"
          echo "--- .gitignore content (if any) ---"
          cat .gitignore 2>/dev/null || echo "(no .gitignore at root)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Verify Flutter/Dart version actually in use
        run: flutter --version

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Ensure iOS platform files exist
        run: |
          # Confirmed via debug output: ios/ exists but ios/Podfile does
          # not - it was never committed, so the iOS platform setup is
          # incomplete. `flutter create --platforms=ios .` safely fills
          # in only the missing standard Flutter-managed files (Podfile,
          # Runner.xcodeproj, etc.) without touching lib/ or pubspec.yaml.
          if [ ! -f ios/Podfile ]; then
            echo "ios/Podfile is missing - regenerating iOS platform files"
            flutter create --platforms=ios .
          fi
          ls -la ios/
          test -f ios/Podfile && echo "ios/Podfile now present" || (echo "ios/Podfile still missing - aborting" && exit 1)

      - name: Set minimum iOS deployment target to 15.0
        run: |
          # Flutter 3.47+ requires iOS 15.0+. The Podfile's platform line
          # is safe to edit with sed (plain text, one line, already
          # confirmed working). project.pbxproj is NOT edited with sed
          # anymore - it's a structured plist-like format and a blind
          # text substitution there corrupted it last run, causing
          # "Could not automatically select an Xcode workspace". Using
          # the `xcodeproj` Ruby gem instead parses and writes the file
          # properly.
          sed -i '' -E "s/#?[[:space:]]*platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/Podfile
          gem list -i xcodeproj || sudo gem install xcodeproj --no-document
          ruby -e "require 'xcodeproj'; p = Xcodeproj::Project.open('ios/Runner.xcodeproj'); p.targets.each { |t| t.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' } }; p.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0' }; p.save"
          echo "--- Podfile platform line ---"
          grep "platform :ios" ios/Podfile
          echo "--- pbxproj deployment targets ---"
          grep "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned .app into an .ipa
        run: |
          # `flutter build ios --no-codesign` only produces an unsigned
          # Runner.app under build/ios/iphoneos - it does NOT create an
          # .ipa. That's what `flutter build ipa` does, which requires
          # real code signing / a provisioning profile - neither of
          # which is set up in this workflow. An .ipa is just a zip
          # file containing a top-level "Payload" folder with the .app
          # inside, so it's built manually here.
          #
          # IMPORTANT: this .ipa is UNSIGNED. It cannot be installed on
          # a real iPhone/iPad or uploaded to TestFlight/App Store as
          # is - it only lets you download and inspect the build
          # output. Shipping to a real device needs an Apple Developer
          # certificate + provisioning profile and proper signing.
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r wages-unsigned.ipa Payload
          rm -rf Payload
          cd -

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wages-ios-app
          path: build/ios/ipa/*.ipa
          retention-days: 30
