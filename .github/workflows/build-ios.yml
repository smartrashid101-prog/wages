name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'  # Latest stable — includes the
                                      # UIScene/FlutterImplicitEngineDelegate
                                      # migration (introduced in 3.38) that
                                      # your ios/Runner/AppDelegate.swift
                                      # already uses. An older pin here is
                                      # exactly what caused "Cannot find
                                      # type 'FlutterImplicitEngineDelegate'
                                      # in scope".
          channel: 'stable'
          cache: true

      - name: Verify Flutter/Dart version actually in use
        run: flutter --version
        # If this ever prints a different version than the one set
        # above, the cache or the action itself is stale — clear the
        # GitHub Actions cache for this repo and re-run.

      - name: Verify Xcode version
        run: xcodebuild -version
        # Flutter 3.38+'s UIScene support targets Xcode 26. macos-latest
        # runners are usually updated with the newest Xcode fairly
        # quickly, but if this prints an older Xcode and the build still
        # fails, add a step here to select a specific installed Xcode:
        #   sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build iOS IPA
        run: |
          flutter build ios --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wages-ios-app
          path: build/ios/ipa/*.ipa
          retention-days: 30
