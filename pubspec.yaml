name: wages
description: Production-ready Hours & Wages Calculator with offline support
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.16.0

  http: ^1.1.0  # Add this
  smtp_service: ^0.0.2  # Add this
  mailer: ^6.0.0  # Well-maintained SMTP package
  
  # State Management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  
  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.3
  
  # PDF Generation
  pdf: ^3.10.4
  printing: ^5.11.1
  
  # Sharing
  share_plus: ^10.1.4
  
  # Formatting
  intl: ^0.19.0
  
  # Connectivity
  connectivity_plus: ^6.1.5
  
  # Charts
  fl_chart: ^0.65.0
  
  # UUID Generation
  uuid: ^4.3.3
  
  # File Picker
  file_picker: ^8.3.7
  
  # Permission Handling
  permission_handler: ^12.0.3
  
  # Device Info
  device_info_plus: ^10.1.2
  
  # Package Info
  package_info_plus: ^8.3.1
  
  # Loading indicators
  flutter_spinkit: ^5.2.0

  shared_preferences: ^2.2.2   # ✅ Add this

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  mockito: ^5.7.0
  build_runner: ^2.4.6
  
  # ✅ App Icon Generator
  flutter_launcher_icons: ^0.13.1
  
  # ✅ Splash Screen Generator
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ✅ Configuration for App Icon
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  
  # Adaptive Icon Setup - White Background
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

# ✅ Configuration for Splash Screen
flutter_native_splash:
  color: "#081b4b"
  image: assets/images/splash_icon.png
  android: true
  ios: true
  web: true
  fullscreen: true
  android_12:
    color: "#081b4b"
    image: assets/images/splash_icon.png